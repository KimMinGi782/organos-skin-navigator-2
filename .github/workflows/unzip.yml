name: unzip
on:
  push:
    paths:
      - "organos-skin-navigator-2.zip"
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip into repo root
        run: |
          mkdir _unz
          unzip -q organos-skin-navigator-2.zip -d _unz
          cp -a _unz/organos-skin-navigator-2/. .
          rm -rf _unz organos-skin-navigator-2.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unzip project files"
          git push
